<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงคะแนนเลือกตั้ง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .candidate-card { cursor: pointer; transition: 0.3s; }
        .candidate-card:hover { transform: scale(1.05); border-color: #0d6efd; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">🗳️ ลงคะแนนเลือกตั้ง</h1>
    <div class="card p-4 mb-4 shadow-sm">
        <label class="form-label">รหัสนักเรียน</label>
        <input type="text" id="studentId" class="form-control form-control-lg" placeholder="กรอกรหัส..">
    </div>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card h-100 candidate-card text-center p-4 shadow-sm" onclick="vote('no1')">
                <h1 class="display-1 fw-bold text-primary">1</h1>
                <h3>นายรักเรียน</h3>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 candidate-card text-center p-4 shadow-sm" onclick="vote('no2')">
                <h1 class="display-1 fw-bold text-success">2</h1>
                <h3>นางสาวพัฒนา</h3>
            </div>
        </div>
    </div>
</div>

<script>
    async function vote(candidateId) {
        const studentId = document.getElementById('studentId').value.trim();
        if (!studentId) return alert("กรุณากรอกรหัสนักเรียน");

        if(!confirm("ยืนยันการเลือก?")) return;

        try {
            const res = await fetch('http://localhost:3000/api/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studentId, candidateId })
            });

            const data = await res.json();
            
            if (res.ok) {
                alert("✅ " + data.message);
                window.location.reload();
            } else {
                alert("❌ " + data.message);
            }
        } catch (err) {
            alert("เชื่อมต่อ Server ไม่ได้");
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container py-5">
    <div class="d-flex justify-content-between">
        <h2 class="text-warning">🔒 ผลคะแนนหลังบ้าน</h2>
        <button onclick="resetSystem()" class="btn btn-danger">⚠️ Reset ระบบ</button>
    </div>
    <hr>
    <div id="resultsArea" class="mt-4">Loading...</div>
</div>

<script>
    // ดึงข้อมูลทุก 2 วินาที (Polling)
    setInterval(loadData, 2000);

    async function loadData() {
        try {
            const res = await fetch('http://localhost:3000/api/stats/admin');
            const data = await res.json();
            
            // หาคะแนนสูงสุดเพื่อทำกราฟ
            let maxVotes = 0;
            data.forEach(d => { if(d.votes > maxVotes) maxVotes = d.votes });

            let html = "";
            data.forEach(item => {
                let width = maxVotes > 0 ? (item.votes / maxVotes) * 100 : 0;
                html += `
                <div class="mb-4">
                    <h4>${item.name} <span class="float-end text-warning">${item.votes}</span></h4>
                    <div class="progress" style="height: 30px;">
                        <div class="progress-bar bg-success" style="width: ${width}%"></div>
                    </div>
                </div>`;
            });
            document.getElementById("resultsArea").innerHTML = html;
        } catch (e) { console.log("Connection error"); }
    }

    async function resetSystem() {
        if(confirm("แน่ใจนะ? คะแนนจะหายหมด!")) {
            await fetch('http://localhost:3000/api/reset', { method: 'POST' });
            alert("Reset เรียบร้อย");
            loadData();
        }
    }
    loadData(); // เรียกครั้งแรกเลย
</script>
</body>
</html>

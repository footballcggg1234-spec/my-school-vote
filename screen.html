<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Live Screen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d6efd; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center;}
        .count-number { font-size: 10rem; font-weight: bold; }
    </style>
</head>
<body>
<div>
    <h1>📢 ยอดผู้มาใช้สิทธิ์</h1>
    <div id="totalCount" class="count-number">0</div>
    <h3>คน</h3>
</div>

<script>
    setInterval(async () => {
        try {
            const res = await fetch('http://localhost:3000/api/stats/public');
            const data = await res.json();
            document.getElementById("totalCount").innerText = data.total_votes;
        } catch (e) {}
    }, 2000);
</script>
</body>
</html>
